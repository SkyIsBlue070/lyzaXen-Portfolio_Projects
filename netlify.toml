# Repository layout: keep the existing project previews at the root;
# build and deploy the full portfolio from its own directory.
[build]
  base = "portfolio"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
